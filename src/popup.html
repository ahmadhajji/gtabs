<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>gTabs</title>
  <style>
    :root { color-scheme: light dark; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { width: 280px; margin: 0; padding: 20px; background: light-dark(#fafafa, #18191c); color: light-dark(#222, #eee); }
    h1 { margin: 0 0 6px; font-size: 20px; }
    p { margin: 0 0 18px; color: light-dark(#555, #bbb); line-height: 1.5; }
    .actions { display: flex; gap: 8px; }
    button { cursor: pointer; border: 1px solid light-dark(#ccc, #555); border-radius: 8px; padding: 11px 16px; font: inherit; background: light-dark(#fff, #282a30); }
    #organize { flex: 1; background: #5a46ce; color: white; border-color: #5a46ce; font-weight: 600; }
    button:disabled { cursor: default; opacity: .5; }
    button:focus-visible { outline: 2px solid #a79afa; outline-offset: 3px; }
    #status { min-height: 42px; margin: 16px 0 8px; font-size: 12px; overflow-wrap: anywhere; }
    #status.error { color: light-dark(#ad2020, #ff9e9e); }
    #undo { border: 0; background: transparent; padding: 5px 0; font-size: 12px; text-decoration: underline; }
  </style>
</head>
<body>
  <h1>gTabs</h1>
  <p>Keep your tabs in order.</p>
  <div class="actions">
    <button id="organize" disabled>Organize</button>
    <button id="open-settings">Settings</button>
  </div>
  <p id="status" role="status" aria-live="polite">Checking status…</p>
  <button id="undo" disabled>Undo last grouping</button>
  <script src="popup.js"></script>
</body>
</html>
